<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Logging in... | SEKAI Hub</title>
    <!--
      这一页此前是三个硬编码的 Tailwind 色（slate-900 / red-500 / violet-300），
      和 hub 本体不是一套配色 —— 登录跳转中间闪一下，看起来像跑到了别的产品。
      改用设计系统的 token，与 index.html 同源。
    -->
    <link rel="stylesheet" href="../assets/css/sekai/primitives.css">
    <link rel="stylesheet" href="../assets/css/sekai/contract.css">
    <link rel="stylesheet" href="../assets/css/sekai/world-system.css">
    <link rel="stylesheet" href="../assets/css/sekai/world-night.css">
    <style>
        body {
            background-color: rgb(var(--sekai-canvas));
            color: rgb(var(--sekai-fg));
            font-family: var(--sekai-font-sans);
            font-size: var(--sekai-text-md);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .error {
            color: rgb(var(--sekai-danger));
        }
        a {
            color: rgb(var(--sekai-accent));
        }
        a:hover {
            color: rgb(var(--sekai-accent-hover));
        }
    </style>
</head>
<body>
    <div id="status">正在验证您的身份...</div>

    <script type="module">
        import Auth from '../assets/js/auth.js';

        function setStatus(text, isError = false) {
            const el = document.getElementById('status');
            el.textContent = '';
            if (isError) {
                const div = document.createElement('div');
                div.className = 'error';
                div.textContent = text;
                el.appendChild(div);
                const br = document.createElement('br');
                el.appendChild(br);
                const a = document.createElement('a');
                a.href = '/';
                a.textContent = '返回首页';
                el.appendChild(a);
            } else {
                el.textContent = text;
            }
        }

        async function handleLoginParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');
            const error = urlParams.get('error');
            const errorDesc = urlParams.get('error_description');

            if (error) {
                setStatus(`认证被拒绝或出错: ${error}${errorDesc ? ' — ' + errorDesc : ''}`, true);
                return;
            }

            if (!code || !state) {
                setStatus('参数无效，正在返回首页...');
                setTimeout(() => { window.location.href = '/'; }, 2000);
                return;
            }

            try {
                await Auth.handleCallback(code, state);
                setStatus('登录成功，正在跳转...');
                window.location.href = '/';
            } catch (err) {
                console.error(err);
                setStatus(`登录失败: ${err?.message || String(err)}`, true);
            }
        }

        handleLoginParams();
    </script>
</body>
</html>
