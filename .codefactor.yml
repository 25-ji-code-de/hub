# CodeFactor 配置
#
# vendored 的第三方/上游文件不参与代码检查 —— 它们的风格由上游决定，
# 本仓不该也不能改（改了就和上游漂移，那正是 vendored 要防的事）。
#
# 具体触发这条配置的是 assets/css/sekai-tokens.css：它是
# sekai-design/tokens/ 四个文件的逐字拼接，每个文件各有自己的
# `:root` 块，于是 stylelint 报 no-duplicate-selectors。
# 要"修"它只能把四块合并，而那样就没法再和上游逐字比对了。

exclude:
  - "assets/css/sekai-tokens.css"
  # sekai-auth SDK 的内联副本（见 #1）
  - "assets/js/vendor/**"
