<!DOCTYPE html>
<html lang="zh-CN" class="world-system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SEKAI Hub — 生态门户与跨项目用户中心">
    <meta name="theme-color" content="#0b0b0e">
    <title>SEKAI Hub | 生态门户</title>
    <link rel="stylesheet" href="assets/css/sekai/primitives.css">
    <link rel="stylesheet" href="assets/css/sekai/contract.css">
    <link rel="stylesheet" href="assets/css/sekai/world-system.css">
    <link rel="stylesheet" href="assets/css/sekai/world-night.css">
    <link rel="stylesheet" href="assets/css/sekai/page.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner"></div>
            <div class="loading-text">SEKAI HUB // SYSTEM</div>
        </div>
    </div>

    <!-- Public View Template -->
    <template id="template-public">
        <header>
            <div class="container sekai-page nav-content">
                <div class="logo">SEKAI Hub</div>
                <button id="login-btn" class="btn btn-primary">登录 / 注册</button>
            </div>
        </header>

        <main>
            <section class="hero">
                <div class="container sekai-page">
                    <h1>SEKAI Platform</h1>
                    <p>连接创作者、开发者与用户的统一生态系统。</p>
                </div>
            </section>

            <section class="container sekai-page">
                <h2 class="section-title">生态项目列表</h2>
                
                <h3 class="category-title">应用层 (Applications)</h3>
                <div class="grid">
                    <div class="card">
                        <div class="card-icon">💬</div>
                        <h3>Nightcord</h3>
                        <p>下一代沉浸式即时通讯平台，专为社区打造。</p>
                        <a href="https://nightcord.de5.net" class="card-link">访问应用 -></a>
                    </div>
                    <div class="card">
                        <div class="card-icon">🎵</div>
                        <h3>25時作業風景</h3>
                        <p>专注的 Lo-Fi 音乐与协作空间。</p>
                        <a href="https://25ji.nightcord.de5.net" class="card-link">进入空间 -></a>
                    </div>
                    <div class="card">
                        <div class="card-icon">🎨</div>
                        <h3>Stickers 图鉴</h3>
                        <p>Project SEKAI 贴纸资源库与搜索。</p>
                        <a href="https://sticker.nightcord.de5.net" class="card-link">浏览贴纸 -></a>
                    </div>
                    <div class="card">
                        <div class="card-icon">✏️</div>
                        <h3>贴纸生成器</h3>
                        <p>自定义文字与角色贴纸导出。</p>
                        <a href="https://st.nightcord.de5.net" class="card-link">去制作 -></a>
                    </div>
                </div>

                <h3 class="category-title">服务层 (Services)</h3>
                <div class="grid">
                    <div class="card">
                        <div class="card-icon">🔑</div>
                        <h3>SEKAI Pass</h3>
                        <p>统一身份认证与安全中心。</p>
                        <a href="https://id.nightcord.de5.net" class="card-link">管理账号 -></a>
                    </div>
                    <div class="card">
                        <div class="card-icon">🤖</div>
                        <h3>Nako AI</h3>
                        <p>多人格对话与贴纸语义推荐。</p>
                        <a href="https://docs.nightcord.de5.net/api/nako" class="card-link">API 文档 -></a>
                    </div>
                </div>

                <h3 class="category-title">基础设施 (Infrastructure)</h3>
                <div class="grid">
                    <div class="card">
                        <div class="card-icon">🌐</div>
                        <h3>Gateway</h3>
                        <p>统一 API 网关与缓存层。</p>
                        <a href="https://api.nightcord.de5.net" class="card-link">API 状态 -></a>
                    </div>
                    <div class="card">
                        <div class="card-icon">📦</div>
                        <h3>Storage</h3>
                        <p>SEKAI v2 上传与媒体 resolve。</p>
                        <a href="https://storage.nightcord.de5.net" class="card-link">存储文档 -></a>
                    </div>
                    <div class="card">
                        <div class="card-icon">📚</div>
                        <h3>文档中心</h3>
                        <p>架构、API 与客户端约定。</p>
                        <a href="https://docs.nightcord.de5.net" class="card-link">阅读文档 -></a>
                    </div>
                </div>
            </section>
        </main>
        
        <footer style="text-align: center; padding: 2rem; color: var(--text-secondary); border-top: 1px solid var(--border); margin-top: auto;">
            © 2026 SEKAI Project. All rights reserved.
        </footer>
    </template>

    <!-- Private View Template -->
    <template id="template-private">
        <header>
            <div class="container sekai-page nav-content">
                <div class="logo">SEKAI Hub</div>
                <button id="logout-btn" class="btn btn-secondary">退出登录</button>
            </div>
        </header>

        <main class="container sekai-page">
            <section class="welcome-section">
                <div class="welcome-text">
                    <h2>欢迎回来，<span id="username-display" style="color: var(--accent);">User</span></h2>
                    <p class="text-secondary">准备好开始今天的创作了吗？</p>
                </div>
                <div class="actions">
                    <button id="account-settings-btn" class="btn btn-primary">账号设置</button>
                </div>
            </section>

            <section class="leaderboard-section" aria-labelledby="leaderboard-title">
                <div class="leaderboard-heading">
                    <div>
                        <h3 id="leaderboard-title" class="section-title">排行榜</h3>
                        <p class="text-secondary">所有成绩默认匿名展示</p>
                    </div>
                    <button id="leaderboard-identity-btn" class="btn btn-secondary" type="button">身份设置</button>
                </div>

                <div class="leaderboard-controls" role="group" aria-label="选择排行榜">
                    <button class="leaderboard-control active" type="button" data-board-id="25ji-focus-weekly">本周专注</button>
                    <button class="leaderboard-control" type="button" data-board-id="25ji-focus-monthly">本月专注</button>
                    <button class="leaderboard-control" type="button" data-board-id="25ji-pomodoros-weekly">本周番茄钟</button>
                    <button class="leaderboard-control" type="button" data-board-id="25ji-focus-all-time">累计专注</button>
                    <button class="leaderboard-control" type="button" data-board-id="25ji-songs-all-time">累计听歌</button>
                    <button class="leaderboard-control" type="button" data-board-id="25ji-streak-best">最高连续登录</button>
                    <button class="leaderboard-control" type="button" data-board-id="25ji-achievements">成就进度</button>
                    <button class="leaderboard-control" type="button" data-board-id="pico-daily">Puzzle 每日挑战</button>
                    <button class="leaderboard-control" type="button" data-board-id="pico-endless">Puzzle 无尽模式</button>
                    <button class="leaderboard-control" type="button" data-board-id="pico-time-attack">Puzzle 计时模式</button>
                </div>

                <div id="leaderboard-status" class="leaderboard-status" role="status">加载中...</div>
                <div class="leaderboard-table-wrap">
                    <table class="leaderboard-table">
                        <thead>
                            <tr><th>名次</th><th>用户</th><th class="leaderboard-score-heading">成绩</th></tr>
                        </thead>
                        <tbody id="leaderboard-entries"></tbody>
                    </table>
                </div>
                <div id="leaderboard-me" class="leaderboard-me" hidden></div>

                <dialog id="leaderboard-identity-dialog" class="leaderboard-dialog">
                    <form id="leaderboard-identity-form" method="dialog">
                        <div class="leaderboard-dialog-header">
                            <h4>榜单身份</h4>
                            <button class="leaderboard-dialog-close" type="button" aria-label="关闭">×</button>
                        </div>
                        <label class="leaderboard-visibility-row">
                            <input id="leaderboard-show-profile" type="checkbox">
                            <span>公开我的榜单昵称</span>
                        </label>
                        <label for="leaderboard-display-name">公开昵称</label>
                        <input id="leaderboard-display-name" maxlength="64" autocomplete="nickname">
                        <p class="text-secondary">关闭公开后仍会匿名参与排名。</p>
                        <div class="leaderboard-dialog-actions">
                            <button class="btn btn-secondary leaderboard-cancel" type="button">取消</button>
                            <button class="btn btn-primary" type="submit">保存</button>
                        </div>
                    </form>
                </dialog>
            </section>

            <section>
                <h3 class="section-title" style="text-align: left; font-size: 1.5rem;">📊 今日数据</h3>
                <div class="dashboard-grid">
                    <div class="stat-card">
                        <div class="stat-header">Nightcord</div>
                        <div class="stat-value">加载中...</div>
                        <div class="stat-label">加载中...</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">25ji 作業風景</div>
                        <div class="stat-value">加载中...</div>
                        <div class="stat-label">加载中...</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">Nako AI</div>
                        <div class="stat-value">加载中...</div>
                        <div class="stat-label">使用 Qwen 模型</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">总体效率</div>
                        <div class="stat-value">加载中...</div>
                        <div class="stat-label">数据统计中</div>
                    </div>
                </div>
            </section>

            <section>
                <h3 class="section-title" style="text-align: left; font-size: 1.5rem;">🎵 25時作業風景 详细统计</h3>
                <div class="dashboard-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                    <div class="stat-card">
                        <div class="stat-header">🔥 连续天数</div>
                        <div class="stat-value" id="streak-days">-</div>
                        <div class="stat-label">持续专注中</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">⏱️ 累计专注</div>
                        <div class="stat-value" id="total-time">-</div>
                        <div class="stat-label">总学习时长</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">🍅 番茄钟总数</div>
                        <div class="stat-value" id="total-pomodoros">-</div>
                        <div class="stat-label">累计完成</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">🎵 播放歌曲</div>
                        <div class="stat-value" id="songs-played">-</div>
                        <div class="stat-label">音乐陪伴</div>
                    </div>
                </div>
            </section>

            <section>
                <div class="dashboard-grid" style="grid-template-columns: 2fr 1fr;">
                    <div>
                        <h3 class="section-title" style="text-align: left; font-size: 1.5rem;">📋 近期活动</h3>
                        <div class="activity-list">
                            <div style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                                加载中...
                            </div>
                        </div>
                    </div>
                    <div>
                        <h3 class="section-title" style="text-align: left; font-size: 1.5rem;">🏆 最近解锁</h3>
                        <div class="achievement-list">
                            <div style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                                加载中...
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section>
                <h3 class="section-title" style="text-align: left; font-size: 1.5rem;">🚀 快速入口</h3>
                <div class="grid">
                    <a href="https://nightcord.de5.net" class="card" style="text-decoration: none;">
                        <div class="card-icon">💬</div>
                        <h3>Nightcord</h3>
                        <p>即时通讯</p>
                    </a>
                    <a href="https://25ji.nightcord.de5.net" class="card" style="text-decoration: none;">
                        <div class="card-icon">🎵</div>
                        <h3>25時作業風景</h3>
                        <p>专注空间</p>
                    </a>
                    <a href="https://nako.nightcord.de5.net" class="card" style="text-decoration: none;">
                        <div class="card-icon">🤖</div>
                        <h3>Nako AI</h3>
                        <p>智能助手</p>
                    </a>
                    <a href="https://docs.nightcord.de5.net" class="card" style="text-decoration: none;">
                        <div class="card-icon">📚</div>
                        <h3>文档中心</h3>
                        <p>知识库</p>
                    </a>
                </div>
            </section>
        </main>
    </template>
    
    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
